[package]
name = "connector-kick"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Kick connector — OAuth 2.1 PKCE auth, REST API, webhook event triggers."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
ring = { workspace = true }
rustls-pemfile = { workspace = true }
base64 = { workspace = true }
# RFC 3339 parsing of `Kick-Event-Message-Timestamp` for webhook replay protection.
chrono = { workspace = true }
springtale-connector = { workspace = true }
springtale-transport = { workspace = true }
# secret_use helpers (bearer_header, header_value, with_str, …) — recommended
# access path for any `SecretBox<T>` we hold in this connector.
springtale-crypto = { workspace = true }
inventory = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
