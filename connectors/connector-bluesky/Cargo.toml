[package]
name = "connector-bluesky"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bluesky connector — ATProto session auth, post/reply/like/repost actions, Jetstream triggers."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
# Jetstream firehose gateway (official Bluesky WebSocket event stream).
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
springtale-connector = { workspace = true }
springtale-transport = { workspace = true }
springtale-crypto = { workspace = true }
inventory = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
