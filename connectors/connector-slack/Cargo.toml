[package]
name = "connector-slack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Slack connector — Socket Mode, slash commands, Block Kit, threads. WARNING: Workspace admins can read ALL messages."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
springtale-connector = { workspace = true }
# safe_http factory — gates rustls + PQ KEX + timeout defaults for every
# reqwest::Client this connector constructs.
springtale-transport = { workspace = true }
springtale-crypto = { workspace = true }
inventory = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
