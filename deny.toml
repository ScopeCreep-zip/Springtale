# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"
ignore = []

[licenses]
unlicensed = "deny"
copyleft = "deny"
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "BSL-1.0",
  "OpenSSL",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = [
  # No OpenSSL — rustls exclusively
  { name = "native-tls", wrappers = [] },
  { name = "openssl-sys", wrappers = [] },
  { name = "openssl", wrappers = [] },
  # E3: rsa crate is affected by RUSTSEC-2023-0071 (Marvin Attack timing
  # sidechannel). No upstream fix exists. Springtale targets vulnerable
  # populations under active surveillance — any pulled-in `rsa` is a
  # supply-chain CVE waiting to land. Block at the workspace level so
  # transitive pulls fail audit before merge.
  { name = "rsa", wrappers = [] },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
