# Deliberately NOT a member of the Rust workspace at the repo root: the
# desktop shell has its own Cargo.lock (plan 2.1 asserts that lock has no
# `springtale-bot`). The empty table states that explicitly so cargo stops
# walking up to a parent manifest — without it a git worktree checked out
# under the main repo gets claimed by the main repo's workspace.
[workspace]

[package]
name = "springtale-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Tauri 2 mobile prep — iOS and Android compile the app as a library
# loaded by the platform framework, while desktop still has a `main`
# binary that calls into the library. The library needs three
# crate-types:
#   - cdylib    iOS dynamic linking
#   - staticlib iOS static linking
#   - rlib      consumed by `src/main.rs` on desktop
# Source: research from `v2.tauri.app/start/project-structure/` +
# Tauri community guidance (May 2026). `tauri ios init` /
# `tauri android init` populate `gen/apple/` and `gen/android/`
# from this same lib target — those commands need Xcode / Android
# SDK on the host running them.
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
# `image-png` feature is required for the runtime tray-icon swap path
# in G5f — `TrayIcon::set_icon` consumes `Image<'_>` constructed via
# `Image::from_bytes` which needs PNG decode support compiled in.
# `image-ico` is the Windows-friendly counterpart; we ship both so
# survivors get tray-icon swap on every desktop platform.
tauri = { version = "2", features = ["image-png", "image-ico", "tray-icon", "isolation"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
# Best-effort OS notifications for fired Notify/SendMessage recipes —
# the delivery layer fans a scheduled bot's message to both the in-app
# chat panel and a native notification so a briefing/reminder reaches
# the user even when the window isn't focused.
tauri-plugin-notification = "2"
# Plan 2.1 — spawns the `springtaled` sidecar (`externalBin`) and pipes
# the vault passphrase to its stdin. `open` stays disabled in
# tauri.conf.json; we never hand a URL to the OS shell.
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
secrecy = "0.10"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
# Timestamps on the picked-selector payload (commands/selector_picker.rs).
chrono = { version = "0.4", features = ["serde"] }

# tauri-specta — generates TypeScript bindings from Rust types and
# Tauri commands. Replaces hand-maintained `Recipe` / `RecipeFilter` /
# command-signature TS interfaces so the wire shape can never drift
# from the Rust source of truth. Pin tracks the rc series both
# `tauri-specta` and `specta-typescript` consume.
specta            = { version = "=2.0.0-rc.25", features = ["derive", "serde_json", "uuid", "chrono"] }
specta-typescript = "0.0.12"
tauri-specta      = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Plan 2.1 — the shell is a sidecar client of `springtaled`, which owns
# the store, the runtime, the scheduler and the bot. Only two crates
# survive here: `springtale-crypto` for the vault overlay + API-token
# derivation, and `springtale-transport` for the PQ rustls provider
# bootstrap at the top of `lib.rs::run`.
springtale-crypto = { path = "../../../../crates/springtale-crypto" }
springtale-transport = { path = "../../../../crates/springtale-transport" }
