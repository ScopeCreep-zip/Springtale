[package]
name = "springtale-connector-sdk"
version = "0.1.0"
edition = "2024"
description = "SDK for building Springtale WASM connectors. Compile to wasm32-unknown-unknown."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"       # optimize for size (smaller .wasm)
lto = true            # link-time optimization
strip = true          # strip debug info
