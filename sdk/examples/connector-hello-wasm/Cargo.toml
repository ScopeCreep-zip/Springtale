[package]
name = "connector-hello-wasm"
version = "0.1.0"
edition = "2024"
description = "Example WASM connector for Springtale — hello world."

[lib]
crate-type = ["cdylib"]

[dependencies]
# The SDK's core-module ABI is not used by a component; the world it
# ships (`../../connector-sdk/wit`) is.
serde_json = "1"
wit-bindgen = "0.61.1"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Standalone: this example is excluded from the root workspace and
# targets wasm32-wasip2, so it resolves its own dependency graph. The
# empty table stops cargo walking up into the workspace above.
[workspace]
