[package]
name = "springtale-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
springtale-connector = { path = "../crates/springtale-connector" }
springtale-transport = { path = "../crates/springtale-transport" }
springtale-core = { path = "../crates/springtale-core" }
serde_json = "1"
toml = "0.8"
url = "2"

[[bin]]
name = "fuzz_manifest_parse"
path = "fuzz_targets/fuzz_manifest_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_capability_parse"
path = "fuzz_targets/fuzz_capability_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ipc_frame"
path = "fuzz_targets/fuzz_ipc_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_path_canon"
path = "fuzz_targets/fuzz_path_canon.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_url_allowlist"
path = "fuzz_targets/fuzz_url_allowlist.rs"
test = false
doc = false
bench = false
