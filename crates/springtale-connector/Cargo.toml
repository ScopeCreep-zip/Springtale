[package]
name = "springtale-connector"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Connector trait, WASM sandbox, manifest management, and capability system."

[features]
default = ["wasm-sandbox"]
wasm-sandbox = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
base64 = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
garde = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
toml = { workspace = true }
inventory = { workspace = true }
dashmap = { workspace = true }
springtale-crypto = { workspace = true }
springtale-store = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wat = { workspace = true }
