[package]
name = "springtale-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for Springtale's cooperation primitives via pyo3 (G3 / COOPERATION_IMPLEMENTATION_PLAN.md §15)"

[lib]
# `cdylib` so maturin / setuptools-rust can produce a Python-loadable
# `.so` / `.pyd`. `rlib` so the crate also remains usable as a Rust
# library (tests, doc-gen).
crate-type = ["cdylib", "rlib"]
name = "springtale"

[dependencies]
springtale-cooperation = { workspace = true }
pyo3                   = { workspace = true }
serde_json             = { workspace = true }
chrono                 = { workspace = true }
uuid                   = { workspace = true }
