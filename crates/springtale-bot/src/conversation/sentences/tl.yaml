# Tagalog sentence templates for the platform verbs (plan 5.4).
#
# Written in the register Filipino users actually type technical
# commands in (Taglish): the verb stays English where the English word
# is the ordinary one, the grammar is Tagalog. Same verbs and slots as
# `en.yaml`; `{formation}` and friends are filled from live state.
locale: tl
verbs:
  formation.list:
    phrases: ["ilista ang mga formation", "ipakita ang mga formation", "anong mga formation meron", "tingnan ang colony"]
  formation.get:
    phrases: ["ipakita ang {formation}", "kumusta na ang {formation}", "status ng {formation}", "ano ang balita sa {formation}"]
  formation.deploy:
    phrases: ["i-deploy ang {formation}", "simulan ang {formation}", "ilunsad ang {formation}", "paandarin ang {formation}"]
  formation.pause:
    phrases: ["i-pause ang {formation}", "itigil muna ang {formation}", "ihinto ang {formation}", "sandaling itigil ang {formation}"]
  formation.resume:
    phrases: ["ituloy ang {formation}", "i-resume ang {formation}", "ipagpatuloy ang {formation}"]
  formation.dissolve:
    phrases: ["buwagin ang {formation}", "tanggalin ang {formation}", "isara ang {formation}"]
  formation.rally:
    phrases: ["tipunin ang {formation}", "pagsama-samahin ang {formation}", "ipokus ang {formation}"]
  formation.intent:
    phrases: ["palitan ang intent ng {formation}", "gawing {intent} ang {formation}", "ano ang ginagawa ng {formation}"]
  formation.guard:
    phrases: ["bantayan ang {formation}", "i-on ang guard ng {formation}", "palitan ang guard ng {formation}"]
  formation.add_member:
    phrases: ["idagdag ang {connector} sa {formation}", "ilagay ang {connector} sa {formation}"]
  formation.remove_member:
    phrases: ["alisin ang {connector} sa {formation}", "tanggalin ang {connector} sa {formation}"]
  approvals.list:
    phrases: ["ilista ang mga approval", "ano ang naghihintay ng approval", "ipakita ang approval queue", "may pending ba"]
  approvals.approve:
    phrases: ["aprubahan ang {id}", "payagan ang {id}", "sabihing oo sa {id}"]
  approvals.deny:
    phrases: ["tanggihan ang {id}", "huwag payagan ang {id}", "sabihing hindi sa {id}"]
  memory.audit:
    phrases: ["i-audit ang memory", "ano ang naaalala mo", "ipakita ang nakaimbak"]
  memory.compact:
    phrases: ["i-compact ang memory", "linisin ang memory", "kalimutan ang mga lumang mensahe"]
  safety.get:
    phrases: ["ipakita ang safety settings", "status ng safety", "ano ang safety config"]
  safety.set:
    phrases: ["gawing {value} ang safety {key}", "palitan ang safety setting na {key}"]
  ai.get:
    phrases: ["anong model ang ginagamit mo", "ipakita ang ai adapter", "anong ai ang naka-configure"]
  ai.set:
    phrases: ["gamitin ang {adapter}", "palitan ang model sa {adapter}", "gawing {adapter} ang ai adapter"]
