# STUB — th (Thai) sentence templates for the platform verbs (plan 5.4).
#
# Deliberately empty, and not for want of translation. The NLU
# tokenizer (`conversation::nlu::normalize::raw_tokens`) splits an
# utterance on non-alphanumeric characters, i.e. on spaces. Thai is
# written without spaces between words, so a template like the Thai
# for "pause {formation}" would collapse to ONE token and could only
# ever match a byte-identical utterance — worse than the English
# fallback, which at least matches the loan words and the formation
# name a Thai speaker types.
#
# Populating this file is blocked on word segmentation for Thai in
# the tokenizer (a dictionary segmenter such as lindera, or ICU break
# iteration), not on the phrasings. Until then `verbs` stays empty and
# this locale falls back to English (`SentenceCatalog::phrases`).
locale: th
verbs: {}
