# Portuguese sentence templates for the platform verbs (plan 5.4).
#
# Same verbs, same slots as `en.yaml`: `{formation}`, `{connector}`,
# `{intent}`, `{id}`, `{key}`, `{value}`, `{adapter}` are filled at
# match time from live state, never hard-coded.
locale: pt
verbs:
  formation.list:
    phrases: ["lista as formações", "mostra as formações", "quais formações existem", "ver a colônia"]
  formation.get:
    phrases: ["mostra {formation}", "como está {formation}", "estado de {formation}", "fala sobre {formation}"]
  formation.deploy:
    phrases: ["implanta {formation}", "inicia {formation}", "lança {formation}", "coloca {formation} para rodar"]
  formation.pause:
    phrases: ["pausa {formation}", "para {formation} por enquanto", "suspende {formation}", "congela {formation}"]
  formation.resume:
    phrases: ["retoma {formation}", "continua com {formation}", "tira {formation} da pausa"]
  formation.dissolve:
    phrases: ["dissolve {formation}", "desfaz {formation}", "encerra {formation}", "remove {formation}"]
  formation.rally:
    phrases: ["reagrupa {formation}", "reúne {formation}", "foca {formation}"]
  formation.intent:
    phrases: ["muda a intenção de {formation}", "coloca {formation} em {intent}", "o que {formation} está fazendo"]
  formation.guard:
    phrases: ["protege {formation}", "ativa a guarda de {formation}", "alterna a guarda de {formation}"]
  formation.add_member:
    phrases: ["adiciona {connector} a {formation}", "põe {connector} em {formation}"]
  formation.remove_member:
    phrases: ["remove {connector} de {formation}", "tira {connector} de {formation}"]
  approvals.list:
    phrases: ["lista as aprovações", "o que está esperando aprovação", "mostra a fila de aprovações", "tem algo pendente"]
  approvals.approve:
    phrases: ["aprova {id}", "permite {id}", "diz sim para {id}"]
  approvals.deny:
    phrases: ["nega {id}", "rejeita {id}", "diz não para {id}"]
  memory.audit:
    phrases: ["audita a memória", "do que você se lembra", "mostra o que está guardado"]
  memory.compact:
    phrases: ["compacta a memória", "limpa a memória", "esquece as mensagens antigas"]
  safety.get:
    phrases: ["mostra as configurações de segurança", "estado da segurança", "como está a segurança"]
  safety.set:
    phrases: ["define {key} de segurança como {value}", "muda a configuração de segurança {key}"]
  ai.get:
    phrases: ["que modelo você está usando", "mostra o adaptador de ia", "qual ia está configurada"]
  ai.set:
    phrases: ["usa {adapter}", "muda o modelo para {adapter}", "define o adaptador de ia como {adapter}"]
