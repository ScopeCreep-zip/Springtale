# Spanish sentence templates for the platform verbs (plan 5.4).
#
# Same verbs, same slots as `en.yaml`: `{formation}`, `{connector}`,
# `{intent}`, `{id}`, `{key}`, `{value}`, `{adapter}` are filled at
# match time from live state, never hard-coded.
locale: es
verbs:
  formation.list:
    phrases: ["lista las formaciones", "muestra las formaciones", "qué formaciones hay", "ver la colonia"]
  formation.get:
    phrases: ["muestra {formation}", "cómo va {formation}", "estado de {formation}", "háblame de {formation}"]
  formation.deploy:
    phrases: ["despliega {formation}", "inicia {formation}", "lanza {formation}", "pon en marcha {formation}"]
  formation.pause:
    phrases: ["pausa {formation}", "detén {formation}", "para {formation} por ahora", "congela {formation}"]
  formation.resume:
    phrases: ["reanuda {formation}", "continúa con {formation}", "quita la pausa a {formation}", "sigue con {formation}"]
  formation.dissolve:
    phrases: ["disuelve {formation}", "desmantela {formation}", "cierra {formation}", "elimina {formation}"]
  formation.rally:
    phrases: ["reagrupa {formation}", "reúne {formation}", "enfoca {formation}"]
  formation.intent:
    phrases: ["cambia la intención de {formation}", "pon {formation} en {intent}", "qué está haciendo {formation}"]
  formation.guard:
    phrases: ["protege {formation}", "activa la guardia de {formation}", "cambia la guardia de {formation}"]
  formation.add_member:
    phrases: ["añade {connector} a {formation}", "mete {connector} en {formation}"]
  formation.remove_member:
    phrases: ["quita {connector} de {formation}", "saca {connector} de {formation}"]
  approvals.list:
    phrases: ["lista las aprobaciones", "qué está esperando aprobación", "muestra la cola de aprobaciones", "hay algo pendiente"]
  approvals.approve:
    phrases: ["aprueba {id}", "permite {id}", "dile que sí a {id}"]
  approvals.deny:
    phrases: ["rechaza {id}", "deniega {id}", "dile que no a {id}"]
  memory.audit:
    phrases: ["audita la memoria", "qué recuerdas", "muestra lo que tienes guardado"]
  memory.compact:
    phrases: ["compacta la memoria", "limpia la memoria", "olvida los mensajes antiguos"]
  safety.get:
    phrases: ["muestra la configuración de seguridad", "estado de seguridad", "cómo está la seguridad"]
  safety.set:
    phrases: ["pon {key} de seguridad en {value}", "cambia el ajuste de seguridad {key}"]
  ai.get:
    phrases: ["qué modelo estás usando", "muestra el adaptador de ia", "qué ia está configurada"]
  ai.set:
    phrases: ["usa {adapter}", "cambia el modelo a {adapter}", "configura el adaptador de ia a {adapter}"]
