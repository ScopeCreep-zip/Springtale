# French sentence templates for the platform verbs (plan 5.4).
#
# Same verbs, same slots as `en.yaml`: `{formation}`, `{connector}`,
# `{intent}`, `{id}`, `{key}`, `{value}`, `{adapter}` are filled at
# match time from live state, never hard-coded.
locale: fr
verbs:
  formation.list:
    phrases: ["liste les formations", "montre les formations", "quelles formations", "voir la colonie"]
  formation.get:
    phrases: ["montre {formation}", "où en est {formation}", "statut de {formation}", "parle-moi de {formation}"]
  formation.deploy:
    phrases: ["déploie {formation}", "démarre {formation}", "lance {formation}", "mets {formation} en route"]
  formation.pause:
    phrases: ["mets {formation} en pause", "arrête {formation} pour l'instant", "suspends {formation}", "gèle {formation}"]
  formation.resume:
    phrases: ["reprends {formation}", "relance {formation}", "enlève la pause de {formation}", "continue avec {formation}"]
  formation.dissolve:
    phrases: ["dissous {formation}", "démantèle {formation}", "ferme {formation}", "supprime {formation}"]
  formation.rally:
    phrases: ["rassemble {formation}", "regroupe {formation}", "recentre {formation}"]
  formation.intent:
    phrases: ["change l'intention de {formation}", "mets {formation} en {intent}", "que fait {formation}"]
  formation.guard:
    phrases: ["protège {formation}", "active la garde de {formation}", "bascule la garde de {formation}"]
  formation.add_member:
    phrases: ["ajoute {connector} à {formation}", "mets {connector} dans {formation}"]
  formation.remove_member:
    phrases: ["retire {connector} de {formation}", "enlève {connector} de {formation}"]
  approvals.list:
    phrases: ["liste les approbations", "qu'est-ce qui attend une approbation", "montre la file d'approbation", "y a-t-il quelque chose en attente"]
  approvals.approve:
    phrases: ["approuve {id}", "autorise {id}", "dis oui à {id}"]
  approvals.deny:
    phrases: ["refuse {id}", "rejette {id}", "dis non à {id}"]
  memory.audit:
    phrases: ["audite la mémoire", "de quoi te souviens-tu", "montre ce qui est stocké"]
  memory.compact:
    phrases: ["compacte la mémoire", "nettoie la mémoire", "oublie les vieux messages"]
  safety.get:
    phrases: ["montre les réglages de sécurité", "état de la sécurité", "quelle est la configuration de sécurité"]
  safety.set:
    phrases: ["règle {key} de sécurité sur {value}", "change le réglage de sécurité {key}"]
  ai.get:
    phrases: ["quel modèle utilises-tu", "montre l'adaptateur ia", "quelle ia est configurée"]
  ai.set:
    phrases: ["utilise {adapter}", "change le modèle pour {adapter}", "règle l'adaptateur ia sur {adapter}"]
