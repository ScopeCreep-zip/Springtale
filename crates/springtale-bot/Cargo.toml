[package]
name = "springtale-bot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Classical bot runtime — deterministic command routing, handler dispatch, conversation state."

[dependencies]
springtale-core      = { workspace = true }
springtale-crypto    = { workspace = true }
springtale-connector = { workspace = true }
springtale-store     = { workspace = true }
springtale-transport = { workspace = true }
springtale-ai        = { workspace = true }
springtale-runtime   = { workspace = true }
springtale-sentinel  = { workspace = true }

async-trait = { workspace = true }
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
chrono      = { workspace = true }
uuid        = { workspace = true }
regex       = { workspace = true }
rand        = { workspace = true }
hex         = { workspace = true }
dashmap     = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
