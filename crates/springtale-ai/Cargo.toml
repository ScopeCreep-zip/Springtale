[package]
name = "springtale-ai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AI adapter trait, input sanitization boundary, and NoopAdapter."

[dependencies]
futures-core = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
async-stream = { workspace = true }
secrecy = { workspace = true }
toml = { workspace = true }
# UTC day-boundary keying for the in-memory token quota's daily reset.
chrono = { workspace = true }
springtale-core = { workspace = true }
# safe_http factory — the only legitimate way to construct a reqwest::Client
# in the workspace. Gates rustls + PQ KEX + timeout defaults.
springtale-transport = { workspace = true }
# secret_use helpers (bearer_header, clone_into_box, with_hmac_key, …) —
# the only place outside springtale-crypto itself that legitimately calls
# `expose_secret`. Pulled in for the AI adapter HTTP auth headers.
springtale-crypto = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
