[package]
name = "springtale-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared runtime initialization for springtaled and desktop app."

[dependencies]
springtale-core = { workspace = true }
springtale-crypto = { workspace = true }
springtale-store = { workspace = true }
springtale-connector = { workspace = true }
springtale-ai = { workspace = true }
springtale-sentinel = { workspace = true }

# Connector crates — linked so their inventory::submit! registrations are
# discovered by init_registry(). The crates are not called directly;
# their factories are iterated via inventory::iter::<FactoryEntry>.
connector-kick = { workspace = true }
connector-presearch = { workspace = true }
connector-bluesky = { workspace = true }
connector-github = { workspace = true }
connector-filesystem = { workspace = true }
connector-shell = { workspace = true }
connector-http = { workspace = true }
connector-telegram = { workspace = true }
connector-nostr = { workspace = true }
connector-irc = { workspace = true }
connector-discord = { workspace = true }
connector-slack = { workspace = true }
connector-signal = { workspace = true }
connector-browser = { workspace = true }

arc-swap = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
inventory = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
