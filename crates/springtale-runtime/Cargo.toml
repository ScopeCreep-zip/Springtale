[package]
name = "springtale-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared runtime initialization for springtaled and desktop app."

[dependencies]
springtale-core = { workspace = true }
springtale-crypto = { workspace = true }
springtale-store = { workspace = true }
springtale-connector = { workspace = true }
springtale-ai = { workspace = true }
springtale-sentinel     = { workspace = true }
springtale-cooperation  = { workspace = true }
springtale-scheduler    = { workspace = true }
# rustls-only HTTP client factory (safe_http) for deploy-time derived-input
# resolvers (e.g. geocoding a free-text city). Never a raw reqwest client.
springtale-transport    = { workspace = true }

# Connector crates — linked so their inventory::submit! registrations are
# discovered by init_registry(). The crates are not called directly;
# their factories are iterated via inventory::iter::<FactoryEntry>.
connector-kick = { workspace = true }
connector-presearch = { workspace = true }
connector-bluesky = { workspace = true }
connector-github = { workspace = true }
connector-filesystem = { workspace = true }
connector-shell = { workspace = true }
connector-http = { workspace = true }
connector-opencode = { workspace = true }
connector-telegram = { workspace = true }
connector-nostr = { workspace = true }
connector-irc = { workspace = true }
connector-discord = { workspace = true }
connector-slack = { workspace = true }
connector-signal = { workspace = true }
connector-browser = { workspace = true }

async-trait = { workspace = true }
arc-swap = { workspace = true }
cap-std = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
inventory = { workspace = true }
secrecy = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
serde_yaml = { workspace = true }
specta = { workspace = true }
utoipa = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# Lock-free pending-approval table for `approval::DefaultDenyApprovalGate`.
# We hold a `oneshot::Sender` per outstanding request; DashMap lets the
# management API's resolve path land without serialising every check.
dashmap = { workspace = true }
# One runtime per store (plan 0.6): exclusive flock on `<db>.lock` held
# by `RuntimeState` for the life of the process.
fd-lock = { workspace = true }

# ── Extraction ladder (Phase A) ────────────────────────────────────────────
# Powers `Action::Extract` per-kind handlers in `crate::extraction`.
dom_smoothie = { workspace = true }
scraper = { workspace = true }
serde_json_path = { workspace = true }
feed-rs = { workspace = true }
icalendar = { workspace = true }
rrule = { workspace = true }
ammonia = { workspace = true }
blake3 = { workspace = true }
similar = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
# Phase-7 audit Finding #1 — wasm_reverify integration test signs a
# manifest at install time and tampers it to prove the boot-time
# re-verifier rejects the tampered bundle.
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
