# cargo-vet imports lockfile — generated by `cargo vet`.
#
# This file pins specific audit-document SHAs from each imported source in
# `config.toml`. It exists so a compromised imports URL cannot silently
# add or remove audits — `cargo vet check` compares against this lock.
#
# Seeded empty; first `cargo vet` run after CI lands will populate it and
# the change will be committed in the same PR.
