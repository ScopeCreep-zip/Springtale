# zizmor — GitHub Actions security auditor.
# https://docs.zizmor.sh/
#
# Runs in `.github/workflows/sast.yml`. Persona: `auditor` (strictest).

rules:
  # Block unpinned action references — per CISA tj-actions Mar-2025 advisory.
  unpinned-uses:
    config:
      policies:
        # GitHub-owned actions (actions/*, github/*) are allowed tag refs — they
        # carry GitHub's own supply-chain guarantees and tags are stable.
        "actions/*": ref-pin
        "github/*": ref-pin
        # Two actions select their behavior from the git ref NAME, so they
        # cannot be hash-pinned without breaking:
        #   - dtolnay/rust-toolchain@{stable,nightly}: the ref IS the toolchain
        #     channel (the action reads github.action_ref).
        #   - taiki-e/install-action@{nextest,...}: the ref names the tool.
        # These stay ref-pinned; everything else must be SHA-pinned.
        "dtolnay/rust-toolchain": ref-pin
        "taiki-e/install-action": ref-pin
        # Anything else outside actions/ or github/ must be SHA-pinned.
        "*": hash-pin

  # Block overly-broad `permissions:` blocks at top level.
  overprovisioned-secrets:
    ignore: []

  # Block `pull_request_target` with checkout of untrusted ref.
  dangerous-triggers:
    ignore: []

  # Block use of `secrets.*` inside `if:` expressions (allows secret leak via run logs).
  secrets-inherit:
    ignore: []

  # Block templated expressions in `run:` blocks (script injection).
  template-injection:
    ignore: []

  # Block runners other than `ubuntu-latest`, `macos-latest`, `windows-latest`,
  # or pinned version variants.
  self-hosted-runner:
    ignore: []
