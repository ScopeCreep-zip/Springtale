# CODEOWNERS validation.
#
# Catches malformed or unreachable patterns before they ship and silently
# skip security review.

name: CODEOWNERS lint

on:
  push:
    branches: [main]
    paths:
      - '.github/CODEOWNERS'
  pull_request:
    branches: [main]
    paths:
      - '.github/CODEOWNERS'
      - '**/CODEOWNERS'

permissions:
  contents: read

jobs:
  validate:
    name: codeowners-validator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: mszostok/codeowners-validator@7f3f5e28c6d7b8dfae5731e54ce2272ca384592f # v0.7.4
        with:
          checks: "files,duppatterns,syntax"
          experimental_checks: "notowned"
