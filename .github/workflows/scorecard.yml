# OpenSSF Scorecard — weekly project health check.
#
# Aligned with CISA OSS Security Roadmap (FY24–FY26). Publishes results to
# the public Scorecard dashboard for the badge in README.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '23 4 * * 1'  # Mondays 04:23 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF
      id-token: write          # publish results to scorecard.dev
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: scorecard
