# OpenSSF Scorecard — weekly project health check.
#
# Aligned with CISA OSS Security Roadmap (FY24–FY26). Publishes results to
# the public Scorecard dashboard for the badge in README.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '23 4 * * 1'  # Mondays 04:23 UTC
  push:
    branches: [main]

# Least-privilege default. The analysis job below declares exactly the
# elevated scopes it needs, so the old top-level `read-all` was redundant
# (and flagged by zizmor excessive-permissions).
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF
      id-token: write          # publish results to scorecard.dev
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: scorecard
