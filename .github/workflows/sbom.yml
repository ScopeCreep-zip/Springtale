# SBOM generation — CycloneDX 1.7 primary, SPDX 2.3 secondary.
#
# Maps to:
# - CISA 2025 Minimum Elements for SBOM
# - NIST SP 800-218 PS.3.2 (provenance / SBOM)
# - OWASP A03 (Software Supply Chain Failures)
#
# Runs on push-to-main + release. Artifacts uploaded and (on release)
# attached to the GitHub Release. Signing is handled by provenance.yml.

name: SBOM

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-sbom:
    name: Rust SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          lookup-only: true
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2
        with:
          tool: cargo-cyclonedx
      - run: |
          set -euo pipefail
          mkdir -p sbom
          # cargo-cyclonedx writes one `<crate>.cdx.json` next to every
          # workspace member's Cargo.toml (there is no `--output-pattern`
          # flag). `--all` includes the full transitive graph. Collect the
          # per-crate BOMs into sbom/ for the merge job.
          cargo cyclonedx --format json --all
          # `-print0 | xargs -0` safely handles paths with spaces / non-ASCII.
          find . -maxdepth 4 -name '*.cdx.json' \
                 -not -path './target/*' \
                 -not -path './node_modules/*' \
                 -not -path './sbom/*' \
                 -print0 \
              | xargs -0 -I{} cp {} sbom/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-sbom
          path: sbom/
          retention-days: 90

  rust-auditable:
    name: cargo auditable build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'release'
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          lookup-only: true
      - run: cargo install cargo-auditable --locked
      - run: cargo auditable build --release --locked --bin springtaled --bin springtale-cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auditable-binaries
          path: |
            target/release/springtaled
            target/release/springtale-cli
          retention-days: 90

  npm-sbom:
    name: npm SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9
      # No dependency cache here on purpose: this job runs on `release:
      # published` and uploads an artifact that the merge job signs, so a
      # poisoned restore cache would taint a signed SBOM (zizmor
      # cache-poisoning). The install is cheap enough without it. With no
      # `cache:` input there is no dependency cache to poison; zizmor's
      # heuristic still flags setup-node as cache-capable (Low confidence),
      # so the residual finding is ignored at this exact site.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 22
      - run: pnpm -C tauri install --frozen-lockfile
      # `@cyclonedx/cyclonedx-npm --package-lock-only` only understands npm's
      # package-lock.json; this is a pnpm workspace. cdxgen reads
      # `pnpm-lock.yaml` directly (`-t pnpm`) and emits CycloneDX JSON.
      - run: |
          npx -y @cyclonedx/cdxgen@12.5.1 \
            -t pnpm \
            -o tauri-sbom.cdx.json \
            tauri
        env:
          # No network enrichment — keep the SBOM build hermetic + fast.
          FETCH_LICENSE: "false"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-sbom
          path: tauri-sbom.cdx.json
          retention-days: 90

  py-sbom:
    name: Python SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # `crates/springtale-py/pyproject.toml` is committed. Forks dropping
    # the pyo3 crate will short-circuit on the missing pyproject path.
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          pip install cyclonedx-bom
          cyclonedx-py environment --output-format JSON --output-file py-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: py-sbom
          path: py-sbom.cdx.json
          retention-days: 90

  mlbom:
    name: ML-BOM (CycloneDX 1.7 machine-learning components)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # `mlbom/springtale.mlbom.cdx.json` enumerates every AI adapter
    # Springtale ships (Noop, Ollama, OpenAI-compatible, Anthropic).
    # Maps to OWASP LLM03 / LLM10. CI validates the file parses,
    # claims CycloneDX 1.7, and lists at least one
    # `machine-learning-model` component.
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate ML-BOM JSON
        run: |
          set -euo pipefail
          jq -e '.bomFormat == "CycloneDX" and (.specVersion | startswith("1.7"))' \
            mlbom/springtale.mlbom.cdx.json > /dev/null
          jq -e '[.components[] | select(.type == "machine-learning-model")] | length > 0' \
            mlbom/springtale.mlbom.cdx.json > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mlbom
          path: mlbom/springtale.mlbom.cdx.json
          retention-days: 90

  cbom:
    name: CBOM (CycloneDX 1.6 cryptographic assets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # `cbom/springtale.cbom.cdx.json` is the hand-curated CBOM, kept in
    # lock-step with `docs/security/CRYPTO-INVENTORY.md` per the quarterly
    # review cadence. CI validates that the JSON parses and conforms to
    # the CycloneDX 1.6 schema, then uploads it for the `merge` job to
    # fold into the workspace BOM.
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate CBOM JSON
        run: |
          set -euo pipefail
          jq -e '.bomFormat == "CycloneDX" and (.specVersion | startswith("1.6"))' \
            cbom/springtale.cbom.cdx.json > /dev/null
          # At least one cryptographic-asset component must be declared.
          jq -e '[.components[] | select(.type == "cryptographic-asset")] | length > 0' \
            cbom/springtale.cbom.cdx.json > /dev/null
          # Every cryptographic-asset must declare an assetType.
          jq -e '
            all(
              .components[] | select(.type == "cryptographic-asset");
              .cryptoProperties.assetType != null
            )
          ' cbom/springtale.cbom.cdx.json > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cbom
          path: cbom/springtale.cbom.cdx.json
          retention-days: 90

  syft-fs:
    name: SPDX (Syft, filesystem)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: springtale-fs.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fs-sbom-spdx
          path: springtale-fs.spdx.json
          retention-days: 90

  merge:
    name: Merge SBOMs + sign
    runs-on: ubuntu-latest
    needs: [rust-sbom, npm-sbom, cbom, mlbom, syft-fs]
    permissions:
      contents: read
      id-token: write          # cosign keyless OIDC + GitHub attestation OIDC
      attestations: write      # GitHub Attestations API write
    if: github.event_name == 'release'
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: sboms/
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Merge CycloneDX
        run: |
          curl -sSfL https://github.com/CycloneDX/cyclonedx-cli/releases/latest/download/cyclonedx-linux-x64 \
            -o cyclonedx-cli && chmod +x cyclonedx-cli
          # Read the BOM paths into an array so paths with spaces survive
          # argument splitting (shellcheck SC2046).
          bom_paths=()
          while IFS= read -r -d '' f; do
            bom_paths+=("$f")
          done < <(find sboms/ \( -name '*.cdx.json' -o -name 'bom*.json' \) -print0)
          ./cyclonedx-cli merge --output-format json \
            --input-files "${bom_paths[@]}" \
            --output-file springtale.cdx.json
      - name: Cosign sign-blob (keyless OIDC)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle springtale.cdx.json.cosign.bundle \
            springtale.cdx.json
      # Two parallel attestation surfaces — both are official:
      #   1. Sigstore cosign keyless (above) — interoperates with the
      #      sigstore ecosystem (Rekor transparency log, cosign verify).
      #   2. GitHub-native attestation (below) — verifiable via
      #      `gh attestation verify --owner ScopeCreep-zip <artifact>`
      #      and queryable through the GitHub Attestations API.
      # The downstream verifier picks whichever they trust; we ship both.
      #
      # Uses the unified `actions/attest@v4` action — `actions/attest-sbom`
      # was deprecated in favor of this single action as of v4.0.0.
      # SBOM mode auto-activates when `sbom-path` is set.
      - name: GitHub SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: springtale.cdx.json
          sbom-path: springtale.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merged-sbom
          path: |
            springtale.cdx.json
            springtale.cdx.json.cosign.bundle
          retention-days: 365
