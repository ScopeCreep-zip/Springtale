# Springtale secret-scanning workflow.
#
# Pre-commit hooks run gitleaks locally; this is the gating CI run.
# Maps to NIST SP 800-218 PW.5.1 and OWASP A09.

name: Secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
        with:
          # Full history required to catch secrets reintroduced in older commits.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_NOTIFY_USER_LIST: '@radicalkjax'

  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only run on PRs — full-history scan handled by gitleaks above.
    if: github.event_name == 'pull_request'
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown
