# Springtale secret-scanning workflow.
#
# Pre-commit hooks run gitleaks locally; this is the gating CI run.
# Maps to NIST SP 800-218 PW.5.1 and OWASP A09.

name: Secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history required to catch secrets reintroduced in older commits.
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action requires a paid/registered license key for org-owned
      # repos. We run the OSS CLI directly instead — pinned by version + SHA256
      # so the binary is reproducible — against the committed `.gitleaks.toml`
      # (which sets `[extend] useDefault = true` to keep the upstream ruleset).
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${sha256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan full history
        run: gitleaks git --no-banner --redact --config .gitleaks.toml .

  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only run on PRs — full-history scan handled by gitleaks above.
    if: github.event_name == 'pull_request'
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pinned to a release tag (not @main) — a moving default branch is a
      # supply-chain risk. The SHA-pin sweep resolves this to a digest.
      - uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown
