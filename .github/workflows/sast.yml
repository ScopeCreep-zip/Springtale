# Springtale SAST — static-analysis suite.
#
# Maps to NIST SP 800-218 PW.7 (tool selection for code review) and the
# OWASP A05 (Injection) tooling baseline.

name: SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-run weekly to catch new rules published by upstream rulesets.
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  # ── CodeQL (JS/TS) ────────────────────────────────────────────────
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config: |
            paths:
              - tauri/apps
              - tauri/packages
            paths-ignore:
              - '**/node_modules/**'
              - '**/dist/**'
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ── Semgrep ───────────────────────────────────────────────────────
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      # Digest-pinned to match the Dockerfile's FROM-pinning posture
      # (zizmor unpinned-images). Tag kept for human readability.
      image: semgrep/semgrep:1.165.0@sha256:f4791a54c891eabe1188248135574e6e03dfc31dfd3f3b747c7bec7079bfed1b
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # `semgrep ci` is the org-policy mode and rejects --config/--error/
      # --severity; `semgrep scan` is the explicit-ruleset mode that accepts
      # them. --error makes the job fail on findings. `|| true` is NOT used —
      # we want a hard gate, but SARIF must still upload, so the upload step
      # runs with `if: always()`.
      - run: |
          semgrep scan \
            --config p/rust \
            --config p/typescript \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/secrets \
            --config p/security-audit \
            --sarif --output=semgrep.sarif \
            --error \
            --severity ERROR --severity WARNING
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ── actionlint ────────────────────────────────────────────────────
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2

  # ── zizmor (workflow security) ────────────────────────────────────
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # zizmor moved orgs: woodruffw/zizmor-action -> zizmorcore/zizmor-action.
      # The action runs zizmor and, with advanced-security (default), uploads
      # SARIF to code scanning itself — no separate upload step needed.
      #
      # persona `auditor` runs the strictest, most complete audit set (all
      # findings, including low/help/info, are visible in the uploaded SARIF).
      # Every medium/high finding it raises has been CORRECTED in-tree, not
      # suppressed: the SHA-pin sweep (unpinned-uses), digest-pinned container
      # images (unpinned-images), the fuzz.yml env-var rewrite
      # (template-injection), scoped scorecard permissions
      # (excessive-permissions), and the npm-sbom cache removal
      # (cache-poisoning). `min-severity: medium` is the failure gate: it fails
      # the build on every actionable security finding while not blocking on
      # the residual low-severity nudges — per-workflow `concurrency` blocks
      # (which would be actively wrong to add to the release/provenance/signing
      # workflows, as they'd cancel in-flight releases) and
      # permission-comment style notes.
      - uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          persona: auditor
          min-severity: medium

  # ── hadolint (Dockerfile) ─────────────────────────────────────────
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: false
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint.sarif
          category: hadolint
