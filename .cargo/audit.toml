[advisories]
ignore = [
    # atomic-polyfill 1.0.3 unmaintained — transitive via garde -> phonenumber ->
    # postcard 1.x -> heapless 0.7. No-op passthrough on x86_64/aarch64.
    # Waiting for postcard 2.0.
    "RUSTSEC-2023-0089",

    # number_prefix 0.4.0 unmaintained — transitive via indicatif (CLI only).
    # No vulnerability, purely cosmetic dep for progress bar formatting.
    "RUSTSEC-2025-0119",

    # rustls-pemfile 2.2.0 unmaintained — functionality merged into rustls.
    # Transitive via irc crate and springtale-transport. No vulnerability.
    "RUSTSEC-2025-0134",

    # rand 0.8.5 unsoundness — requires `log` feature + custom logger calling
    # thread_rng() during reseed. We pin default-features=false in workspace
    # Cargo.toml, so the `log` feature is absent from the binary. The UB code
    # path does not exist. Cannot upgrade to 0.9.3+ until RustCrypto ships
    # stable releases with rand_core 0.9 (ed25519-dalek 3.x, chacha20poly1305
    # 0.11.x). Mitigated by feature exclusion, not accepted risk.
    "RUSTSEC-2026-0097",

    # bincode 2.0.1 unmaintained — upstream team ceased development after a
    # doxxing/harassment incident. No CVE. Pulled transitively via foca
    # (SWIM membership) with the `bincode-codec` feature. bincode 2.0.1 is
    # functionally complete; no exploitation path. Tracking foca's migration
    # to postcard/wincode. See `vex/bincode-rustsec-2025-0141.json`.
    "RUSTSEC-2025-0141",

    # instant 0.1.13 unmaintained — upstream recommends migrating callers to
    # `web-time`. Pulled transitively via nostr-sdk -> nostr-relay-pool ->
    # nostr-database -> nostr. instant 0.1.13 has no known soundness issues.
    # No safe upgrade — the migration must happen in nostr-sdk. Tracking
    # upstream issue. See `vex/instant-rustsec-2024-0384.json`.
    "RUSTSEC-2024-0384",

    # lru 0.13 IterMut Stacked Borrows soundness — pulled transitively via
    # chitchat (workspace SWIM/scuttlebutt). Springtale doesn't call
    # lru::IterMut directly; chitchat is on the dependabot ignore list (wire
    # format critical). See `vex/lru-rustsec-2026-0002.json`.
    "RUSTSEC-2026-0002",

    # proc-macro-error2 2.0.1 unmaintained — author confirmed end-of-life on
    # 2026-06-07. Build-time only, pulled transitively via tabled_derive ->
    # tabled (springtale-cli table rendering). No runtime code, no CVE. Tracking
    # tabled's migration away from it. See `vex/proc-macro-error2-rustsec-2026-0173.json`.
    "RUSTSEC-2026-0173",
]
