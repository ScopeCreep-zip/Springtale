[package]
name = "springtaled"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Test-only fixture (`src/test_harness`), shared by the springtaled and
# springtale-cli test suites. Never in `default`: a normal build must not
# compile an in-memory AppState builder into the daemon.
test-harness = ["dep:arc-swap"]

[dependencies]
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
rust-embed = { workspace = true }
rustls = { workspace = true }
garde = { workspace = true }
chrono = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
uuid = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
figment = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rpassword = { workspace = true }
clap = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
springtale-core = { workspace = true }
springtale-crypto = { workspace = true }
springtale-transport = { workspace = true }
springtale-connector = { workspace = true }
springtale-scheduler = { workspace = true }
springtale-store = { workspace = true }
springtale-ai = { workspace = true }
springtale-bot = { workspace = true }
springtale-mcp = { workspace = true }
springtale-sentinel = { workspace = true }
springtale-runtime = { workspace = true }
springtale-cooperation = { workspace = true }
connector-telegram = { workspace = true }
connector-nostr = { workspace = true }
connector-irc = { workspace = true }
connector-discord = { workspace = true }
connector-slack = { workspace = true }
connector-signal = { workspace = true }
connector-bluesky = { workspace = true }
twilight-gateway = { workspace = true }
twilight-http = { workspace = true }
twilight-model = { workspace = true }
irc = { workspace = true }
secrecy = { workspace = true }
rand = { workspace = true }
arc-swap = { workspace = true, optional = true }
nostr-sdk = { workspace = true }

[dev-dependencies]
# Self dev-dependency: turns on `test-harness` for this crate's own test
# targets without putting it in `default`.
springtaled = { path = ".", features = ["test-harness"] }
tokio = { workspace = true, features = ["test-util"] }
http-body-util = "0.1"
arc-swap = { workspace = true }
# event_recipe_e2e: exercises a real connector's normalize_event against
# recorded provider payloads + the real recipe dispatch chain.
connector-github = { workspace = true }
toml = { workspace = true }
