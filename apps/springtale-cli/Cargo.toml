[package]
name = "springtale-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
indicatif = { workspace = true }
tabled = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rpassword = { workspace = true }
figment = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
secrecy = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
springtale-core = { workspace = true }
springtale-crypto = { workspace = true }
springtale-connector = { workspace = true }
springtale-store = { workspace = true }
springtale-runtime = { workspace = true }
# Brings in `crypto_provider::install_default_pq` for the rustls bootstrap
# at `main.rs` entry. CLI subcommands `server`/`run` boot the daemon path
# which constructs `rustls::ServerConfig`; that needs a process-global
# provider installed first.
springtale-transport = { workspace = true }

# Required so `apps/springtale-cli/examples/task-runner.rs` (plan §7.1),
# `llm-swarm.rs` (§7.2), and `telegram-bot.rs` (§7.3) can import Formation,
# CadenceBus, and related cooperation primitives directly.
springtale-cooperation = { workspace = true }
springtale-bot = { workspace = true }
springtale-ai = { workspace = true }
springtale-sentinel = { workspace = true }
connector-telegram = { workspace = true }

# Shell completions + man page are generated at build time from the same
# `src/cli.rs` the binary compiles (see `build.rs` for the include! mechanism).
[build-dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `tests/daemon_client.rs` runs the real CLI binary against a real
# springtaled, which is the proof that a CLI edit is visible to a running
# daemon (plan Â§2.2, finding 3).
springtaled = { workspace = true, features = ["test-harness"] }
